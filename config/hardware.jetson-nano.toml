[system]
project_name = "AILamp"
platform = "jetson-nano"

[controller]
model = "NVIDIA Jetson Nano Developer Kit 4GB"
mpn = "945-13450-0000-100"
storage = "Not used on basic Jetson Nano Developer Kit; boot from microSD"
system_card = "SanDisk Ultra microSDXC 64GB UHS-I"

[software]
target_os = "NVIDIA JetPack 4.6.x / Jetson Linux R32.x, Ubuntu 18.04 based"
jetpack = "JetPack 4.6.1 SD card image for Jetson Nano Developer Kit; R32.7.6 is the latest Nano BSP line when flashing manually"
python = "AILamp Python >=3.11; reuse the working LeLamp Python environment for ST3215 playback because upstream currently requires Python >=3.12"
install_extra = "nano"
vision_runtime = "OpenAI API-hybrid vision and opt-in OpenAI brain; no local YOLO, pose model, microphone, or speaker on Jetson Nano"
simulation_runtime = "MuJoCo runs on Mac/PC only, not on Jetson Nano"

[power]
jetson_supply = "Jetson Nano 5V 4A DC barrel jack power supply, 5.5mm x 2.1mm center-positive, with J48 jumper cap"
servo_supply = "MEAN WELL GST120A12-P1J, 12V 10A 120W"
led_supply = "MEAN WELL GST60A05-P1J, 5V 6A 30W"
emergency_switch = "12V 10A DC inline switch / emergency stop switch"
barrel_adapter = "5.5mm x 2.1mm DC barrel screw terminal adapter"
power_connector = "WAGO 221-413 lever connector"
power_wire_red = "22AWG red silicone wire"
power_wire_black = "22AWG black silicone wire"
signal_wire = "24AWG silicone wire"

[motors]
port = "/dev/ttyACM0"
# Existing calibrated LeLamp follower identity. Keep stable; do not recalibrate unless the user explicitly chooses to.
lamp_id = "ailamp"
driver_model = "Waveshare Servo Driver with ESP32, SKU 21593"
servo_model = "Waveshare ST3215 Servo, 30kg.cm @ 12V, SKU 22414"
servo_quantity = 5
fps = 30
ids = { base_yaw = 1, base_pitch = 2, elbow_pitch = 3, wrist_roll = 4, wrist_pitch = 5 }

[led]
port = "/dev/ttyACM1"
controller = "Raspberry Pi Pico WH"
panel = "Adafruit NeoPixel NeoMatrix 8x8, 64 RGB LED, Product ID 1487"
count = 64
baudrate = 115200
brightness = 128
power_supply = "MEAN WELL GST60A05-P1J, 5V 6A 30W"
logic_level_shifter = "TXS0108E 8-Channel Logic Level Converter Module"

[camera]
model = "Arducam UB0234, 2D 2MP OV2710 USB2.0 UVC Camera, 1080p, M12 lens; no depth camera required"
device = 0
device_path = "/dev/video0"
width = 640
height = 480
fps = 15
pixel_format = "MJPG"

[vision]
backend = "api_hybrid"
model = "disabled-on-jetson-nano"
pose_model = "disabled-on-jetson-nano"
pose_enabled = false
api_enabled = true
api_model = "gpt-4.1-mini"
api_interval_s = 1.0
api_image_max_px = 512
api_timeout_s = 10.0
api_event_ttl_s = 2.0
confidence = 0.45
left_threshold = -0.20
right_threshold = 0.20
close_area_ratio = 0.35
far_area_ratio = 0.02
far_depth_m = 3.0

[audio]
input_enabled = false
output_enabled = false
input_model = "Optional future upgrade: Seeed Studio ReSpeaker XVF3800 USB 4-Mic Array with Case, Product 6490"
speaker_model = "Optional future upgrade: Seeed Studio Mono Enclosed Speaker, 4 ohm 5W"
input_device = "disabled"
output_device = "disabled"

[voice]
provider = "openai"
transport = "livekit"
enabled = false

[runtime]
vision_state_file = "outputs/vision_state.json"
vision_interval_s = 0.2
action_cooldown_s = 1.5

[brain]
enabled = false
provider = "openai"
model = "gpt-4.1-mini"
interval_s = 3.0
timeout_s = 10.0
plan_ttl_s = 8.0
max_calls = 200
image_max_px = 512

[simulation]
model_path = "simulation/ailamp_scene.xml"
recordings_dir = "ailamp_runtime/ailamp/recordings"
lock_freejoint = true

